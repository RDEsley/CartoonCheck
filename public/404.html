<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff8eb" />
    <meta name="robots" content="noindex" />
    <title>Página não encontrada · Cartoon Check</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        font-family: system-ui, sans-serif;
        color: #27233a;
        background: #fff8eb;
      }
      main {
        max-width: 420px;
        padding: 28px 24px;
        background: #fff;
        border: 2px solid #27233a;
        border-radius: 20px 23px 18px 22px;
        box-shadow: 4px 5px 0 #27233a;
      }
      img {
        display: block;
        margin-bottom: 16px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 28px;
        line-height: 1.15;
      }
      p {
        margin: 0 0 20px;
        line-height: 1.5;
        color: #655d6f;
      }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 48px;
        padding: 0 20px;
        font-weight: 800;
        color: #27233a;
        text-decoration: none;
        background: #fcca54;
        border: 2px solid #27233a;
        border-radius: 13px 16px 12px 15px;
        box-shadow: 3px 4px 0 #27233a;
      }
      a:focus-visible {
        outline: 3px solid #6740a4;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="" width="64" height="64" />
      <h1>Este caminho não existe.</h1>
      <p>O endereço pode estar errado ou a página pode ter mudado de lugar.</p>
      <a href="/app">Abrir Cartoon Check</a>
    </main>
  </body>
</html>
